<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d"><title id="t">MiniDB++ engine architecture</title><desc id="d">Layered architecture: a CLI client talks over a binary TCP protocol to the SQL engine (parser, binder, executor), which runs on the catalog, B+ tree index and tuple store, then the page allocator, the LRU-K buffer pool and the disk manager. A log manager with a segmented write-ahead log, a recovery coordinator and a checkpoint manager sit alongside.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#4f769d"/></marker></defs><rect width="900" height="480" fill="#f2f6fa"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#284e74">MINIDB++ · C++20 RELATIONAL ENGINE</text><g font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><g stroke="#315a82" stroke-width="2.5"><rect x="70" y="62" width="520" height="44" rx="6" fill="#ffffff"/><rect x="70" y="130" width="520" height="44" rx="6" fill="#dbe7f3"/><rect x="70" y="198" width="250" height="44" rx="6" fill="#e7eef5"/><rect x="340" y="198" width="250" height="44" rx="6" fill="#e7eef5"/><rect x="70" y="266" width="520" height="44" rx="6" fill="#e7eef5"/><rect x="70" y="334" width="520" height="44" rx="6" fill="#cfe0f2"/><rect x="70" y="402" width="520" height="44" rx="6" fill="#ffffff"/></g><g fill="#203d5a"><text x="330" y="89">CLI client  ⇄  versioned binary TCP protocol</text><text x="330" y="157">SQL engine · lexer → parser → binder → executor</text><text x="195" y="225">B+ tree (UINT32 PK)</text><text x="465" y="225">Catalog · TupleStore</text><text x="330" y="293">Page allocator · slotted 4 KiB pages</text><text x="330" y="361">Buffer pool · 128 frames · LRU-K (K = 2)</text><text x="330" y="429">Disk manager · database.db</text></g><g stroke="#805300" stroke-width="2.5"><rect x="650" y="130" width="190" height="72" rx="6" fill="#fbe3b8"/><rect x="650" y="232" width="190" height="72" rx="6" fill="#fbe3b8"/><rect x="650" y="334" width="190" height="72" rx="6" fill="#fbe3b8"/></g><g fill="#5a3a00"><text x="745" y="160">Log manager</text><text x="745" y="184" font-size="12" font-weight="normal">segmented WAL · CRC32C</text><text x="745" y="262">Recovery</text><text x="745" y="286" font-size="12" font-weight="normal">REDO · CLR-based UNDO</text><text x="745" y="364">Checkpoints</text><text x="745" y="388" font-size="12" font-weight="normal">sharp · fuzzy · reclamation</text></g></g><g fill="none" stroke="#4f769d" stroke-width="2.5" marker-end="url(#a)"><path d="M330 106v20M330 174v20M195 242v20M465 242v20M330 310v20M330 378v20M590 166h56M745 202v26M745 304v26M646 370h-52"/></g><text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="12" fill="#5b7085">STEAL / NO-FORCE durability with persistent PageLSNs; recovery survives repeated crashes.</text></svg>
